<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Afegir parcel·la</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu">
      <a href="index.html" class="menu__enllac" data-i18n="Inici">Inici</a>
      <a href="afegir.html" class="menu__enllac menu__enllac--actiu" data-i18n="Afegir parcel·la">Afegir parcel·la</a>
    </nav>
    <span id="selector-idioma" class="selector-idioma"></span>
  </header>

  <main>
    <section class="formulari-parcela">
      <h2 data-i18n="Afegir una nova parcel·la">Afegir una nova parcel·la</h2>

      <form id="form-parcela">
        <fieldset id="dades-cadastre">
          <div class="camp">
            <label for="provincia" data-i18n="Provincia">Provincia</label>
            <select id="provincia" name="provincia" required>
              <option value="" data-i18n="Carregant...">Carregant...</option>
            </select>
          </div>

          <div class="camp">
            <label for="poligon" data-i18n="Polígon">Polígon</label>
            <input type="text" id="poligon" name="poligon" required>
          </div>

          <div class="camp">
            <label for="parcela" data-i18n="Parcel·la">Parcel·la</label>
            <input type="text" id="parcela" name="parcela" required>
          </div>

          <div class="camp">
            <label for="poblacio" data-i18n="Població">Població</label>
            <select id="poblacio" name="poblacio" required disabled>
              <option value="" data-i18n="Tria primer una província">Tria primer una província</option>
            </select>
          </div>

          <button type="button" id="boto-consultar" data-i18n="Consultar cadastre">Consultar cadastre</button>
        </fieldset>

        <p id="missatge-estat" class="missatge-estat" hidden></p>

        <fieldset id="dades-us-risc" hidden>
          <div class="camp">
            <span class="etiqueta-camp" data-i18n="Ús (segons el Cadastre)">Ús (segons el Cadastre)</span>
            <p id="valor-us-cadastre" class="valor-nomes-lectura"></p>
          </div>

          <div class="camp" id="camp-desglossament" hidden>
            <span class="etiqueta-camp" data-i18n="Desglossament de subparceles">Desglossament de subparceles</span>
            <p id="valor-desglossament" class="valor-nomes-lectura"></p>
          </div>

          <button type="submit" id="boto-desar" data-i18n="Desar parcel·la">Desar parcel·la</button>
        </fieldset>
      </form>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
  <script type="module" src="js/afegir.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
