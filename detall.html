<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Detall de la parcel·la</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu">
      <a href="index.html" class="menu__enllac">Inici</a>
      <a href="afegir.html" class="menu__enllac">Afegir parcel·la</a>
    </nav>
  </header>

  <main>
    <p><a href="index.html">&larr; Tornar al llistat</a></p>

    <section id="mapa-detall" class="mapa mapa--detall" aria-label="Perímetre de la parcel·la"></section>

    <section id="dades-parcela" class="fitxa-parcela-contenidor">
      Carregant...
    </section>

    <section id="accions-parcela" class="accions-parcela" hidden>
      <button type="button" id="boto-exportar-gpx" class="boto-secundari">Exportar track (GPX)</button>
      <button type="button" id="boto-editar" class="boto-secundari">Editar ús / risc</button>
      <button type="button" id="boto-esborrar" class="boto-perillos">Esborrar parcel·la</button>
    </section>

    <form id="form-editar" class="formulari-parcela" hidden>
      <div class="camp">
        <label for="editar-us">Ús</label>
        <select id="editar-us" name="us" required>
          <option value="agricola">Agrícola</option>
          <option value="forestal">Forestal</option>
          <option value="pastura">Pastura</option>
          <option value="mix">Mixt (diversos usos)</option>
          <option value="altre">Altre</option>
        </select>
      </div>

      <div class="camp">
        <label for="editar-risc">Risc d'incendi</label>
        <select id="editar-risc" name="risc" required>
          <option value="baix">Baix</option>
          <option value="mitja">Mitjà</option>
          <option value="alt">Alt</option>
        </select>
      </div>

      <div class="formulari-parcela__botons">
        <button type="submit">Desar canvis</button>
        <button type="button" id="boto-cancelar-editar" class="boto-secundari">Cancel·lar</button>
      </div>
    </form>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/detall.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
