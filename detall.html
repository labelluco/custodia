<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Detall de la parcel·la</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icones/icona.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icones/icona-192.png">
  <link rel="apple-touch-icon" href="icones/icona-192.png">
  <meta name="theme-color" content="#396a49">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu" id="menu-principal">
      <a href="index.html" class="menu__enllac" data-i18n="Inici">Inici</a>

      <div class="menu__grup">
        <button type="button" class="menu__grup-boto" aria-expanded="false" data-i18n="Parcel·les">Parcel·les</button>
        <div class="menu__submenu">
          <a href="parceles.html" class="menu__enllac" data-i18n="Llistar">Llistar</a>
          <a href="afegir.html" class="menu__enllac" data-i18n="Afegir">Afegir</a>
        </div>
      </div>

      <div class="menu__grup">
        <button type="button" class="menu__grup-boto" aria-expanded="false" data-i18n="Agrupacions">Agrupacions</button>
        <div class="menu__submenu">
          <a href="agrupacions.html" class="menu__enllac" data-i18n="Llistar">Llistar</a>
          <a href="afegir-agrupacio.html" class="menu__enllac" data-i18n="Afegir">Afegir</a>
        </div>
      </div>

      <div class="menu__grup">
        <button type="button" class="menu__grup-boto" aria-expanded="false" data-i18n="Geometries">Geometries</button>
        <div class="menu__submenu">
          <a href="geometries.html" class="menu__enllac" data-i18n="Llistar">Llistar</a>
          <a href="afegir-geometria.html" class="menu__enllac" data-i18n="Afegir">Afegir</a>
        </div>
      </div>
    </nav>
    <div class="capcalera__dreta">
      <button type="button" id="boto-menu" class="boto-menu" aria-expanded="false" aria-controls="menu-principal" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
      <span id="selector-idioma" class="selector-idioma"></span>
    </div>
  </header>

  <main>
    <p id="enllac-tornar"><a href="parceles.html" class="enllac-tornar" data-i18n="← Tornar al llistat">&larr; Tornar al llistat</a></p>

    <section id="mapa-detall" class="mapa mapa--detall" aria-label="Perímetre de la parcel·la"></section>

    <section id="filtre-mapa" class="fitxa-parcela-contenidor" hidden>
      <h2 data-i18n="Mostrar al mapa">Mostrar al mapa</h2>
      <select id="select-filtre-mapa" class="select-simple">
        <option value="cap" data-i18n="Només el perímetre">Només el perímetre</option>
        <option value="altitud" data-i18n="Altitud">Altitud</option>
        <option value="orientacio" data-i18n="Orientació">Orientació</option>
        <option value="cotes" data-i18n="Cotes màxima i mínima">Cotes màxima i mínima</option>
      </select>
    </section>

    <div class="panell">
      <section id="seccio-risc-calculat" class="fitxa-parcela-contenidor fitxa-parcela-contenidor--risc" hidden>
        <h2 data-i18n="Risc d'incendi calculat">Risc d'incendi calculat</h2>
        <div id="contingut-risc-calculat"></div>
      </section>

      <section id="dades-parcela" class="fitxa-parcela-contenidor">
        <h2 data-i18n="Dades de la parcel·la">Dades de la parcel·la</h2>
        <div id="contingut-dades-parcela" data-i18n="Carregant...">Carregant...</div>
      </section>

      <section id="seccio-subparceles" class="fitxa-parcela-contenidor" hidden>
        <h2 data-i18n="Subparceles (Cadastre)">Subparceles (Cadastre)</h2>
        <div class="taula-parceles-contenidor">
          <table class="taula-parceles">
            <thead>
              <tr>
                <th data-i18n="Descripció">Descripció</th>
                <th data-i18n="Superfície">Superfície</th>
                <th data-i18n="Risc base">Risc base</th>
                <th data-i18n="Índex prod.">Índex prod.</th>
                <th data-i18n="Codi">Codi</th>
              </tr>
            </thead>
            <tbody id="llistat-subparceles"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section id="accions-parcela" class="accions-parcela" hidden>
      <button type="button" id="boto-pendent-orientacio" class="boto-secundari" data-i18n="Altimetria">Altimetria</button>
      <button type="button" id="boto-exportar-gpx" class="boto-secundari" data-i18n="Exportar track (GPX)">Exportar track (GPX)</button>
      <button type="button" id="boto-esborrar" class="boto-perillos" data-i18n="Esborrar parcel·la">Esborrar parcel·la</button>
    </section>
  </main>

  <footer class="peu">
    <p>
      Custòdia — <span data-i18n="Programari lliure">Programari lliure</span> (AGPL-3.0) ·
      <a href="https://codeberg.org/mario_escuder/custodia" target="_blank" rel="noopener" data-i18n="Codi font">Codi font</a> ·
      <a href="mailto:mario.escuder1982@gmail.com" data-i18n="Contacte">Contacte</a>
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/detall.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
