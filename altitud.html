<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Altitud i pendent</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu">
      <a href="index.html" class="menu__enllac" data-i18n="Inici">Inici</a>
      <a href="afegir.html" class="menu__enllac" data-i18n="Afegir parcel·la">Afegir parcel·la</a>
    </nav>
    <span id="selector-idioma" class="selector-idioma"></span>
  </header>

  <main>
    <p id="enllac-tornar"><a href="index.html" data-i18n="← Tornar al llistat">&larr; Tornar al llistat</a></p>

    <h2 data-i18n="Altitud i pendent">Altitud i pendent</h2>

    <fieldset id="seleccio-metode" class="formulari-parcela">
      <legend data-i18n="Mètode de càlcul">Mètode de càlcul</legend>

      <div class="camp camp--radio">
        <label>
          <input type="radio" name="metode" value="vertexs" checked>
          <span data-i18n="Vèrtexs del perímetre">Vèrtexs del perímetre</span>
        </label>
      </div>

      <div class="camp camp--radio">
        <label>
          <input type="radio" name="metode" value="malla">
          <span data-i18n="Malla de punts">Malla de punts</span>
        </label>
        <div class="camp" style="margin-left: 1.5rem;">
          <label for="distancia-malla" data-i18n="Distància entre punts (m)">Distància entre punts (m)</label>
          <input type="number" id="distancia-malla" name="distanciaMalla" min="1" value="10">
        </div>
        <p class="nota" style="margin-left: 1.5rem;" data-i18n="Amb aquest mètode també es calcula l'orientació mitjana del terreny.">
          Amb aquest mètode també es calcula l'orientació mitjana del terreny.
        </p>
      </div>

      <button type="button" id="boto-calcular" data-i18n="Calcular">Calcular</button>
    </fieldset>

    <p id="instruccio-mapa" hidden></p>

    <section id="mapa-altitud" class="mapa" aria-label="Perímetre amb vèrtexs" hidden></section>

    <section id="resum-altimetria" class="fitxa-parcela-contenidor" hidden></section>

    <button type="button" id="boto-desar-altimetria" hidden data-i18n="Desar a la parcel·la">Desar a la parcel·la</button>
    <p id="missatge-estat" class="missatge-estat" hidden></p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/altitud.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
