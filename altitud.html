<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Altitud i pendent</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icones/icona.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icones/icona-192.png">
  <link rel="apple-touch-icon" href="icones/icona-192.png">
  <meta name="theme-color" content="#396a49">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu" id="menu-principal">
      <a href="index.html" class="menu__enllac" data-i18n="Inici">Inici</a>
      <a href="afegir.html" class="menu__enllac" data-i18n="Afegir parcel·la">Afegir parcel·la</a>
    </nav>
    <div class="capcalera__dreta">
      <button type="button" id="boto-menu" class="boto-menu" aria-expanded="false" aria-controls="menu-principal" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
      <span id="selector-idioma" class="selector-idioma"></span>
    </div>
  </header>

  <main>
    <p id="enllac-tornar"><a href="index.html" class="enllac-tornar" data-i18n="← Tornar al llistat">&larr; Tornar al llistat</a></p>

    <h2 data-i18n="Altitud i pendent">Altitud i pendent</h2>

    <section id="mapa-altitud" class="mapa" aria-label="Perímetre amb vèrtexs"></section>
    <p id="instruccio-mapa" class="fitxa-parcela-contenidor" hidden></p>

    <div class="panell">
      <section id="resum-altimetria" class="fitxa-parcela-contenidor" hidden>
        <h2 data-i18n="Resultats">Resultats</h2>
        <div id="contingut-resum-altimetria"></div>
      </section>

      <div id="seleccio-metode" class="fitxa-parcela-contenidor" role="group" aria-labelledby="titol-metode-calcul">
        <h2 id="titol-metode-calcul" data-i18n="Mètode de càlcul">Mètode de càlcul</h2>

        <div class="metode-contingut">
          <div class="camp camp--radio">
            <label>
              <input type="radio" name="metode" value="vertexs">
              <span data-i18n="Vèrtexs del perímetre">Vèrtexs del perímetre</span>
            </label>
          </div>

          <div class="camp camp--radio">
            <label>
              <input type="radio" name="metode" value="malla" checked>
              <span data-i18n="Malla de punts">Malla de punts</span>
            </label>
          </div>
          <div class="metode-malla-detalls">
            <div class="camp">
              <label for="distancia-malla" data-i18n="Distància entre punts (m)">Distància entre punts (m)</label>
              <input type="number" id="distancia-malla" name="distanciaMalla" min="1" value="10">
            </div>
            <p class="nota" data-i18n="Amb aquest mètode també es calcula l'orientació mitjana del terreny.">
              Amb aquest mètode també es calcula l'orientació mitjana del terreny.
            </p>
          </div>

          <button type="button" id="boto-calcular" class="boto-estret" data-i18n="Calcular">Calcular</button>
        </div>
      </div>
    </div>

    <button type="button" id="boto-desar-altimetria" class="boto-estret" hidden data-i18n="Desar a la parcel·la">Desar a la parcel·la</button>
    <p id="missatge-estat" class="missatge-estat" hidden></p>
  </main>

  <footer class="peu">
    <p>
      Custòdia — <span data-i18n="Programari lliure">Programari lliure</span> (AGPL-3.0) ·
      <a href="https://codeberg.org/mario_escuder/custodia" target="_blank" rel="noopener" data-i18n="Codi font">Codi font</a> ·
      <a href="mailto:mario.escuder1982@gmail.com" data-i18n="Contacte">Contacte</a>
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/altitud.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
