<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Custòdia — Altimetria</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icones/icona.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icones/icona-192.png">
  <link rel="apple-touch-icon" href="icones/icona-192.png">
  <meta name="theme-color" content="#396a49">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="nucli/css/nucli.css">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body class="pantalla-mapa" data-seccio="parceles">
  <header class="barra-superior">
    <a href="index.html" class="marca"><img src="icones/icona.svg" alt="" class="marca__icona" width="32" height="32"><span class="marca__nom">Custòdia</span></a>
    <nav id="navegacio" class="pestanyes navegacio" aria-label="Seccions" data-i18n-aria-label="Seccions"></nav>
    <div class="barra-superior__accions">
      <div id="selector-idioma" class="selector-idioma"></div>
      <button type="button" id="boto-menu" class="boto-icona boto-menu" title="Menú" aria-label="Menú" data-i18n-title="Menú" data-i18n-aria-label="Menú"><svg><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <main>
    <div id="mapa-altitud" class="mapa" role="region" aria-label="Perímetre amb vèrtexs" data-i18n-aria-label="Perímetre amb vèrtexs"></div>

    <section class="panell" aria-labelledby="titol-pagina">
      <button type="button" class="panell__ansa" aria-expanded="true" aria-label="Plegar o desplegar el panell" data-i18n-aria-label="Plegar o desplegar el panell"></button>
      <div class="panell__capcalera">
        <a id="enllac-tornar" href="parceles.html" class="boto-icona boto-icona--pla" title="Tornar al detall" aria-label="Tornar al detall" data-i18n-title="Tornar al detall" data-i18n-aria-label="Tornar al detall"><svg><use href="#i-enrere"/></svg></a>
        <div class="panell__capcalera-text">
          <h1 id="titol-pagina" class="panell__titol" data-i18n="Altimetria">Altimetria</h1>
          <p id="subtitol-pagina" class="panell__subtitol"></p>
        </div>
      </div>

      <p id="instruccio-mapa" class="panell__pista panell__pista--destacada" hidden></p>

      <section id="resum-altimetria" class="bloc" hidden>
        <h2 class="bloc__titol" data-i18n="Resultats">Resultats</h2>
        <div id="contingut-resum-altimetria"></div>
      </section>

      <div id="seleccio-metode" class="grup-camps" role="group" aria-labelledby="titol-metode-calcul">
        <span id="titol-metode-calcul" class="camp__etiqueta" data-i18n="Mètode de càlcul">Mètode de càlcul</span>
        <div class="pestanyes pestanyes--radio">
          <label class="pestanyes__opcio"><input type="radio" name="metode" value="vertexs" class="nomes-lectors"><span data-i18n="Vèrtexs del perímetre">Vèrtexs del perímetre</span></label>
          <label class="pestanyes__opcio"><input type="radio" name="metode" value="malla" class="nomes-lectors" checked><span data-i18n="Malla de punts">Malla de punts</span></label>
        </div>
        <div class="metode-malla-detalls">
          <label class="camp">
            <span class="camp__etiqueta" data-i18n="Distància entre punts (m)">Distància entre punts (m)</span>
            <input type="number" id="distancia-malla" name="distanciaMalla" class="camp__entrada" min="1" value="10" inputmode="numeric">
          </label>
          <p class="panell__pista" data-i18n="Amb aquest mètode també es calcula l'orientació mitjana del terreny.">Amb aquest mètode també es calcula l'orientació mitjana del terreny.</p>
        </div>
        <button type="button" id="boto-calcular" class="boto boto--primari boto--ample" data-i18n="Calcular">Calcular</button>
      </div>

      <button type="button" id="boto-desar-altimetria" class="boto boto--primari boto--ample" hidden data-i18n="Desar a la parcel·la">Desar a la parcel·la</button>
      <p id="missatge-estat" class="missatge-estat" role="status" hidden></p>

      <footer class="peu-panell">
        <p class="avis-privacitat"><svg><use href="#i-escut"/></svg><span data-i18n="Les teves dades es guarden només en aquest dispositiu. Les consultes van directament al Cadastre i a l'IGN.">Les teves dades es guarden només en aquest dispositiu. Les consultes van directament al Cadastre i a l'IGN.</span></p>
        <p class="peu-panell__credits">Custòdia · <span data-i18n="Programari lliure">Programari lliure</span> (AGPL-3.0) · <a href="https://codeberg.org/mario_escuder/custodia" target="_blank" rel="noopener" data-i18n="Codi font">Codi font</a> · <a href="mailto:mario.escuder1982@gmail.com" data-i18n="Contacte">Contacte</a></p>
      </footer>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
  <script type="module" src="js/altitud.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
