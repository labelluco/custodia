<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custòdia — Altitud i pendent</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <h1>Custòdia</h1>
    <nav class="menu">
      <a href="index.html" class="menu__enllac">Inici</a>
      <a href="afegir.html" class="menu__enllac">Afegir parcel·la</a>
    </nav>
  </header>

  <main>
    <p id="enllac-tornar"><a href="index.html">&larr; Tornar al llistat</a></p>

    <h2>Altitud i pendent</h2>

    <fieldset id="seleccio-metode" class="formulari-parcela">
      <legend>Mètode de càlcul</legend>

      <div class="camp camp--radio">
        <label>
          <input type="radio" name="metode" value="vertexs" checked>
          Vèrtexs del perímetre
        </label>
      </div>

      <div class="camp camp--radio">
        <label>
          <input type="radio" name="metode" value="malla">
          Malla de punts
        </label>
        <div class="camp" style="margin-left: 1.5rem;">
          <label for="distancia-malla">Distància entre punts (m)</label>
          <input type="number" id="distancia-malla" name="distanciaMalla" min="1" value="10">
        </div>
      </div>

      <button type="button" id="boto-calcular">Calcular</button>
    </fieldset>

    <p id="instruccio-mapa" hidden></p>

    <section id="mapa-altitud" class="mapa" aria-label="Perímetre amb vèrtexs" hidden></section>

    <section id="resum-altimetria" class="fitxa-parcela-contenidor" hidden></section>

    <button type="button" id="boto-desar-altimetria" hidden>Desar a la parcel·la</button>
    <p id="missatge-estat" class="missatge-estat" hidden></p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/altitud.js"></script>
  <script type="module" src="js/registrar-sw.js"></script>
</body>
</html>
